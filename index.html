<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematchics</title>
    <script src="https://cdn.jsdelivr.net/npm/seedrandom@3.0.5/seedrandom.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/seedrandom@3.0.5/coverage/lcov-report/prettify.min.css">
</head>

<body>
    <style>
        * {
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        html {
            background-color: lightblue;
        }

        button {
            width: 45px;
            border-radius: 20%;
            color: navy;
            font-size: xx-large;
            background: lightblue;
            border: 3px solid navy;
        }

        * {
            border-radius: 10%;

        }

        #set1 {
            text-align: center;
            width: 20vw;
            color: navy;
            background: aliceblue;
            border: 3px solid navy;
            position: absolute;
            border-radius: 10%;
            top: 200px;
            left: 30vw;
            height: fit-content;
        }

        #sum1,
        #sum2,
        #swaps {
            border: 3px solid navy;
        }

        #swaps {
            width: 30vw;
            text-align: center;
            left: 35vw;
            color: navy;
            top: 0vh;
            position: absolute;
        }

        #set2 {
            text-align: center;
            position: absolute;
            width: 20vw;
            color: navy;
            border-radius: 10%;
            background: aliceblue;
            border: 3px solid navy;
            left: 50vw;
            top: 200px;
            height: fit-content;
        }

        #inst {
            text-align: center;
            width: 50vw;
            height: fit-content;
            color: navy;
            background: lightblue;
            border: 3px solid navy;
            overflow-x: auto;
            left: 25vw;
            position: absolute;
            border-radius: 10%;
        }

        select {
            height: fit-content;
            color: navy;
            background: lightblue;
            border: 3px solid navy;
            top: 180px;
            width: 40vw;
            left: 30vw;
            position: absolute;
            border-radius: 10%;
        }

        option {
            height: fit-content;
            color: navy;
            background: lightblue;
            border: 3px solid navy;
            border-radius: 10%;
        }
    </style>
    <div id="inst">
        <h3> Instructions</h3>
        <p> There are two sets of double digit numbers. Click any 2 single digits to swap them. Goal: make the sums the
            same, the more numbers the easier. Do as few swaps as possible.
        </p>
    </div>

    <select>
        <option>Select A Level...</option>
        <option class="8" value="8">8th Degree</option>
        <option class="12" value="12">12th Degree</option>
        <option class="16" value="16">16th Degree</option>
    </select>
    <div id="game">
        <h4 id="swaps">Swaps: 0</h4>
        <div id="set1">
            <h1>Set 1</h1>
        </div>
        <div id="set2">
            <h1>Set 2</h1>
        </div><br>
    </div>




    <script>
        var count = 0;
        var val1, e1;
        var swaps = 0;
        var date = new Date();
        date = date.toISOString().split("T")[0];
        let hash = 0;
        document.querySelector("select").onchange = (e) => {
            document.querySelector("#set1").innerHTML = "<h1>Set 1</h1>";
            document.querySelector("#set2").innerHTML = "<h1>Set 2</h1>";

            if (localStorage.getItem("pos8") != undefined && localStorage.getItem("pos8") != "D" && e.target.value === "8") {
                document.querySelector("#game").innerHTML = localStorage.getItem("pos8")
                document.querySelectorAll("button").forEach(b => {
                    b.onclick = (e) => {
                        if (count === 0) {
                            count++;
                            val1 = e.target.innerHTML
                            e1 = e.target;
                        }
                        else {
                            count--;
                            e1.innerHTML = e.target.innerHTML;
                            e.target.innerHTML = val1;

                            swaps++;
                            recount();
                        }
                    }
                })
            }
            else if (localStorage.getItem("pos12") != undefined && localStorage.getItem("pos12") != "D" && e.target.value === "12") {
                document.querySelector("#game").innerHTML = localStorage.getItem("pos12")
                document.querySelectorAll("button").forEach(b => {
                    b.onclick = (e) => {
                        if (count === 0) {
                            count++;
                            val1 = e.target.innerHTML
                            e1 = e.target;
                        }
                        else {
                            count--;
                            e1.innerHTML = e.target.innerHTML;
                            e.target.innerHTML = val1;

                            swaps++;
                            recount();
                        }
                    }
                })
            }
            else if (localStorage.getItem("pos16") != undefined && localStorage.getItem("pos16") != "D" && e.target.value === "16") {
                document.querySelector("#game").innerHTML = localStorage.getItem("pos16")
                document.querySelectorAll("button").forEach(b => {
                    b.onclick = (e) => {
                        if (count === 0) {
                            count++;
                            val1 = e.target.innerHTML
                            e1 = e.target;
                        }
                        else {
                            count--;
                            e1.innerHTML = e.target.innerHTML;
                            e.target.innerHTML = val1;

                            swaps++;
                            recount();
                        }
                    }
                })
            }
            else {
                for (let i = 0; i < date.length; i++) {
                    hash = date.charCodeAt(i) + ((hash << 5) - hash);
                }
                console.log(hash)
                var rnd = new Math.seedrandom(date);
                var result = Math.floor(rnd() * (9 * 10 ** (12 * parseInt(e.target.value)))) + 10 ** (12 * parseInt(e.target.value))
                result = BigInt(result).toString();
                console.log(result)
                for (let i = 0; i < parseInt(e.target.value); i++) {
                    document.querySelector("#set1").innerHTML += "<button class='d1'>" + result.substring(i * 12, i * 12 + 1) + "</button>"
                    document.querySelector("#set1").innerHTML += "<button class='d2'>" + result.substring(i * 12 + 2, i * 12 + 3) + "</button>"
                    document.querySelector("#set1").innerHTML += "<button class='d3'>" + result.substring(i * 12 + 4, i * 12 + 5) + "</button>"
                    document.querySelector("#set1").innerHTML += "<br>"
                    document.querySelector("#set2").innerHTML += "<button class='d4'>" + result.substring(i * 12 + 6, i * 12 + 7) + "</button>"
                    document.querySelector("#set2").innerHTML += "<button class='d5'>" + result.substring(i * 12 + 8, i * 12 + 9) + "</button>"
                    document.querySelector("#set2").innerHTML += "<button class='d6'>" + result.substring(i * 12 + 10, i * 12 + 11) + "</button>"
                    document.querySelector("#set2").innerHTML += "<br>"
                }
                document.querySelector("#set1").innerHTML += "<h1 id='sum1'></h1>"
                document.querySelector("#set2").innerHTML += "<h1 id='sum2'></h1>"
                document.querySelectorAll("button").forEach(b => {
                    b.onclick = (e) => {
                        if (count === 0) {
                            count++;
                            val1 = e.target.innerHTML
                            e1 = e.target;
                        }
                        else {
                            count--;
                            e1.innerHTML = e.target.innerHTML;
                            e.target.innerHTML = val1;

                            swaps++;
                            recount();
                        }
                    }
                })
                setTimeout(recount, 200)
            }
        }

        function recount() {
            var s1 = 0, s2 = 0, s3 = 0, s4 = 0, s5 = 0, s6 = 0;
            document.querySelectorAll(".d1").forEach((dig) => {
                s1 += parseInt(dig.innerHTML)
            })
            document.querySelectorAll(".d2").forEach((dig) => {
                s2 += parseInt(dig.innerHTML)
            })
            document.querySelectorAll(".d3").forEach((dig) => {
                s3 += parseInt(dig.innerHTML)
            })
            document.querySelectorAll(".d4").forEach((dig) => {
                s4 += parseInt(dig.innerHTML)
            })
            document.querySelectorAll(".d5").forEach((dig) => {
                s5 += parseInt(dig.innerHTML)
            })
            document.querySelectorAll(".d6").forEach((dig) => {
                s6 += parseInt(dig.innerHTML)
            })

            document.querySelector("#sum1").innerHTML = s1 * 100 + s2 * 10 + s3;
            document.querySelector("#sum2").innerHTML = s4 * 100 + s5 * 10 + s6;
            if (parseInt(document.querySelector("#sum1").innerHTML) === parseInt(document.querySelector("#sum2").innerHTML)) {
                document.querySelector("#sum1").style.backgroundColor = "green";
                document.querySelector("#sum2").style.backgroundColor = "green";

                document.querySelector("#sum1").style.color = "white";
                document.querySelector("#sum2").style.color = "white";
                document.querySelector("#swaps").innerHTML = "Swaps: " + swaps;
                document.querySelectorAll("button").forEach(b => b.disabled = true)
            }
            localStorage.setItem("pos" + document.querySelector("select").value, document.querySelector("#game").innerHTML)

        }
    </script>
</body>

</html>
