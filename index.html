
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematchics</title>
</head>
<body>
    <style>
        button{
            font-size:x-large;
        }
        #set1{
            position: absolute;
            top:200px;
        }
        #set2{
            position: absolute;
            left: 250px;
            top:200px;
            width:350px;
        }
        #inst{
            width: 100px;
            overflow-x: auto;
            position: absolute;
        }
    </style>
    <h1>Select a Level:</h1>
    <select>
        <option>Select...</option>
        <option value="8">8th Degree</option>
        <option value="12">12th Degree</option>
        <option value="16">16th Degree</option>
    </select>
    <div id="set1"><h1>Set 1</h1></div><div id="set2"><h1>Set 2</h1></div>
    <div id="inst"><h3> Instructions</h3><p>Click 2 digits to swap them. make the sums the same, the more numbers the easier. Do as few swaps as possible.
    </p></div>
    <script>
        var count = 0;
        var val1, e1;
        var swaps = 0;
        document.querySelector("select").onchange = (e)=> {
            
            document.querySelector("select").disabled= true;
            for(let i = 0; i < parseInt(e.target.value); i++){
                var dig1 = Math.floor(Math.random()* 10);
                var dig2 = Math.floor(Math.random()* 10);
                var dig3 = Math.floor(Math.random()* 10);
                var dig4 = Math.floor(Math.random()* 10);
                var dig5 = Math.floor(Math.random()* 10);
                var dig6 = Math.floor(Math.random()* 10);
                var dig7 = Math.floor(Math.random()* 10);
                var dig8 = Math.floor(Math.random()* 10);
                document.querySelector("#set1").innerHTML+= "<button class='d1'>"+ dig1 +"</button>"
                document.querySelector("#set1").innerHTML+= "<button class='d2'>"+ dig2 +"</button>"
                document.querySelector("#set1").innerHTML+= "<button class='d3'>"+ dig3 +"</button>"
                document.querySelector("#set1").innerHTML+= "<button class='d4'>"+ dig4 +"</button>"
                document.querySelector("#set2").innerHTML+= "<button class='d5'>"+ dig5 +"</button>"
                document.querySelector("#set2").innerHTML+= "<button class='d6'>"+ dig6 +"</button>"
                document.querySelector("#set2").innerHTML+= "<button class='d7'>"+ dig7 +"</button>"
                document.querySelector("#set2").innerHTML+= "<button class='d8'>"+ dig8 +"</button>"
            }
            document.querySelector("#set1").innerHTML+= "<h1 id='sum1'></h1>"
            document.querySelector("#set2").innerHTML+= "<h1 id='sum2'></h1>"
            document.querySelectorAll("button").forEach(b=> {
                b.onclick = (e) => {
                    if(count === 0){
                        count++;
                        val1 = e.target.innerHTML
                        e1 = e.target;
                    }
                    else{
                        count--;
                        e1.innerHTML = e.target.innerHTML;
                        e.target.innerHTML = val1;
                        
                        swaps++;
                        recount();
                    }
                }
            })
            setTimeout(recount, 200)
        }
        function recount(){
            var s1 = 0, s2 = 0, s3=0, s4=0, s5=0,s6=0,s7=0 ,s8=0;
            document.querySelectorAll(".d1").forEach((dig)=> {
                s1 += parseInt(dig.innerHTML)
            })
            document.querySelectorAll(".d2").forEach((dig)=> {
                s2 += parseInt(dig.innerHTML)
            })
            document.querySelectorAll(".d3").forEach((dig)=> {
                s3 += parseInt(dig.innerHTML)
            })
            document.querySelectorAll(".d4").forEach((dig)=> {
                s4 += parseInt(dig.innerHTML)
            })
            document.querySelectorAll(".d5").forEach((dig)=> {
                s5 += parseInt(dig.innerHTML)
            })
            document.querySelectorAll(".d6").forEach((dig)=> {
                s6 += parseInt(dig.innerHTML)
            })
            document.querySelectorAll(".d7").forEach((dig)=> {
                s7 += parseInt(dig.innerHTML)
            })
            document.querySelectorAll(".d8").forEach((dig)=> {
                s8 += parseInt(dig.innerHTML)
            })
            document.querySelector("#sum1").innerHTML = s1*1000 + s2*200+s3*10+s4;
            document.querySelector("#sum2").innerHTML = s5*1000 + s6*100+s7*10+s8
            if(parseInt(document.querySelector("#sum1").innerHTML) === parseInt(document.querySelector("#sum2").innerHTML)){
                setTimeout(()=>{ 
                    alert("YOU WON!!! You did it in " + swaps + " moves")
                    location.reload()
                },1000)
            }
        }
    </script>
</body>
</html>
