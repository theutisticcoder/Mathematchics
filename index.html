<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematchics</title>
    <script src="https://cdn.jsdelivr.net/npm/seedrandom@3.0.5/seedrandom.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/seedrandom@3.0.5/coverage/lcov-report/prettify.min.css">
</head>

<body>
    <style>
        button {
            font-size: large;
            color: white;
            background: black;
            width: 30px;
            border-radius: 20%;
        }

        #set1 {
            position: absolute;
            top: 200px;
        }

        #set2 {
            position: absolute;
            left: 200px;
            top: 200px
        }

        #inst {
            width: 250px;
            overflow-x: auto;
            position: relative;

        }

        select {
            top: 170px;
            position: absolute;
        }
    </style>
    <div id="inst">
        <h3> Instructions</h3>
        <p> There are two sets of dohble digit numbers. Click any 2 single digits to swap them. Goal: make the sums the
            same, the more numbers the easier. Do as few swaps as possible.
        </p>
    </div>

    <select>
        <option>Select A Level...</option>
        <option class="8" value="8">8th Degree</option>
        <option class="12" value="12">12th Degree</option>
        <option class="16" value="16">16th Degree</option>
    </select>
    <div id="game">
        <div id="set1">
            <h1>Set 1</h1>
        </div>
        <div id="set2">
            <h1>Set 2</h1>
        </div><br>
    </div>



    <script>
        var count = 0;
        var val1, e1;
        var swaps = 0;
        var date = new Date();
        date = date.toISOString().split("T")[0];
        let hash = 0;



        document.querySelector("select").onchange = (e) => {
            if (localStorage.getItem("pos8") != undefined && localStorage.getItem("pos8") != "D" && e.target.value === "8") {
                document.querySelector("#game").innerHTML = localStorage.getItem("pos8")
            }
            else if (localStorage.getItem("pos12") != undefined && localStorage.getItem("pos12") != "D" && e.target.value === "12") {
                document.querySelector("#game").innerHTML = localStorage.getItem("pos12")
            }
            else if (localStorage.getItem("pos16") != undefined && localStorage.getItem("pos16") != "D" && e.target.value === "16") {
                document.querySelector("#game").innerHTML = localStorage.getItem("pos16")
            }
            else if (localStorage.getItem("pos8") != undefined && localStorage.getItem("pos8") === "D" && e.target.value === "8") {
                document.querySelector("#sum1").backgroundColor = "green";
                document.querySelector("#sum2").backgroundColor = "green";
                document.querySelector("set1").children.forEach(b => b.disabled = true)
                document.querySelector("set2").children.forEach(b => b.disabled = true)
            }
            else if (localStorage.getItem("pos12") != undefined && localStorage.getItem("pos12") === "D" && e.target.value === "12") {
                document.querySelector("#sum1").backgroundColor = "green";
                document.querySelector("#sum2").backgroundColor = "green";
                document.querySelector("set1").children.forEach(b => b.disabled = true)
                document.querySelector("set2").children.forEach(b => b.disabled = true)
            }
            else if (localStorage.getItem("pos16") != undefined && localStorage.getItem("pos16") === "D" && e.target.value === "16") {
                document.querySelector("#sum1").backgroundColor = "green";
                document.querySelector("#sum2").backgroundColor = "green";
                document.querySelector("set1").children.forEach(b => b.disabled = true)
                document.querySelector("set2").children.forEach(b => b.disabled = true)
            }
            else {
                for (let i = 0; i < date.length; i++) {
                    hash = date.charCodeAt(i) + ((hash << 5) - hash);
                }
                console.log(hash)
                var rnd = new Math.seedrandom(date);
                var result = Math.floor(rnd() * (9 * 10 ** (8 * parseInt(e.target.value)))) + 10 ** (8 * parseInt(e.target.value))
                result = BigInt(result).toString();
                console.log(result)
                document.querySelector("select").disabled = true;
                for (let i = 0; i < parseInt(e.target.value); i++) {
                    document.querySelector("#set1").innerHTML += "<button class='d1'>" + result.substring(i * 8, i * 8 + 1) + "</button>"
                    document.querySelector("#set1").innerHTML += "<button class='d2'>" + result.substring(i * 8 + 2, i * 8 + 3) + "</button>"
                    document.querySelector("#set1").innerHTML += "<br>"
                    document.querySelector("#set2").innerHTML += "<button class='d3'>" + result.substring(i * 8 + 4, i * 8 + 5) + "</button>"
                    document.querySelector("#set2").innerHTML += "<button class='d4'>" + result.substring(i * 8 + 6, i * 8 + 7) + "</button>"
                    document.querySelector("#set2").innerHTML += "<br>"
                }
                document.querySelector("#set1").innerHTML += "<h1 id='sum1'></h1>"
                document.querySelector("#set2").innerHTML += "<h1 id='sum2'></h1>"
                document.querySelectorAll("button").forEach(b => {
                    b.onclick = (e) => {
                        if (count === 0) {
                            count++;
                            val1 = e.target.innerHTML
                            e1 = e.target;
                        }
                        else {
                            count--;
                            e1.innerHTML = e.target.innerHTML;
                            e.target.innerHTML = val1;

                            swaps++;
                            recount();
                        }
                    }
                })
                setTimeout(recount, 200)
            }
        }

        function recount() {
            var s1 = 0, s2 = 0, s3 = 0, s4 = 0;
            document.querySelectorAll(".d1").forEach((dig) => {
                s1 += parseInt(dig.innerHTML)
            })
            document.querySelectorAll(".d2").forEach((dig) => {
                s2 += parseInt(dig.innerHTML)
            })
            document.querySelectorAll(".d3").forEach((dig) => {
                s3 += parseInt(dig.innerHTML)
            })
            document.querySelectorAll(".d4").forEach((dig) => {
                s4 += parseInt(dig.innerHTML)
            })

            document.querySelector("#sum1").innerHTML = s1 * 10 + s2;
            document.querySelector("#sum2").innerHTML = s3 * 10 + s4;
            localStorage.setItem("pos" + document.querySelector("select").value, document.querySelector("#game").innerHTML)
            if (parseInt(document.querySelector("#sum1").innerHTML) === parseInt(document.querySelector("#sum2").innerHTML)) {
                document.querySelector("#sum1").backgroundColor = "green";
                document.querySelector("#sum2").backgroundColor = "green";
                localStorage.setItem("pos" + document.querySelector("select").value, "D")
            }
        }
    </script>
</body>

</html>
